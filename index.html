const N = 19;
const nodeColor = (id) => NODE_COLORS[id] || '#888888';

// Fibonacci sphere placement
function fibonacciSphere(n) {
  const pts = [];
  const phi = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < n; i++) {
    const y = 1 - (i / (n - 1)) * 2;
    const r = Math.sqrt(1 - y * y);
    const theta = phi * i;
    pts.push([Math.cos(theta) * r, y, Math.sin(theta) * r]);
  }
  return pts;
}

const basePositions = fibonacciSphere(N); // unit sphere

// Spotlight state
const nodeOpacity    = new Array(N + 1).fill(1.0); // per-node fade
const activeSizeScale = new Array(N + 1).fill(1.0); // 1.0 → 1.2 for active
let connOpacity  = 1.0;   // non-active connections
let overlayAlpha = 0.0;   // dark vignette

// Camera animation toward active node
let targetRotX = 0.3, targetRotY = 0.0;

// Nebula offscreen canvas (declared early so resize() can reference it)
let nebulaCanvas = null;

// Load images
const imgs = {};
let loadedCount = 0;
const totalImgs = N;

function startWhenReady() {
  if (loadedCount === totalImgs) init();
}

for (let i = 1; i <= N; i++) {
  const img = new Image();
  img.onload = () => { loadedCount++; startWhenReady(); };
  img.src = IMAGES_B64[i];

}

// Canvas setup
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  if (nebulaCanvas) buildNebula(W, H);
}
resize();
window.addEventListener('resize', resize);

// Camera / rotation state
let rotX = 0, rotY = 0;
const AUTO_SPEED = 0.002;
let zoom = 1.0;
let activeNode = null;

// Drag state
let dragging = false;
let lastX = 0, lastY = 0;
let touchStartX = 0, touchStartY = 0, touchDragDist = 0;

canvas.addEventListener('mousedown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('mousemove', e => {
  if (!dragging) return;
  rotY += (e.clientX - lastX) * 0.005;
  rotX += (e.clientY - lastY) * 0.005;
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('mouseleave', () => dragging = false);

// Touch (single-finger drag + pinch-to-zoom + tap)
let pinchDist = 0, pinchActive = false;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 2) {
    pinchActive = true;
    dragging = false;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchDist = Math.sqrt(dx*dx + dy*dy);
    touchDragDist = 999; // prevent accidental tap
  } else {
    pinchActive = false;
    const t = e.touches[0];
    dragging = true;
    lastX = touchStartX = t.clientX;
    lastY = touchStartY = t.clientY;
    touchDragDist = 0;
  }
}, {passive: false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 2 && pinchActive) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const newDist = Math.sqrt(dx*dx + dy*dy);
    if (pinchDist > 0) {
      zoom = Math.min(Math.max(zoom * (newDist / pinchDist), 100/260), 420/260);
      const sl = document.getElementById('zoomSlider');
      if (sl) sl.value = zoom;
    }
    pinchDist = newDist;
  } else if (!pinchActive && dragging) {
    const t = e.touches[0];
    const dx = t.clientX - lastX;
    const dy = t.clientY - lastY;
    touchDragDist += Math.sqrt(dx * dx + dy * dy);
    rotY += dx * 0.005;
    rotX += dy * 0.005;
    lastX = t.clientX;
    lastY = t.clientY;
  }
}, {passive: false});
canvas.addEventListener('touchend', e => {
  if (e.touches.length < 2) pinchActive = false;
  dragging = e.touches.length > 0 && !pinchActive;
  if (e.touches.length === 0 && touchDragDist < 10) {
    const t = e.changedTouches[0];
    const hit = hitTest(t.clientX, t.clientY);
    if (hit !== null) setActiveNode(activeNode === hit ? null : hit);
  }
});

// Click to select node
canvas.addEventListener('click', e => {
  const hit = hitTest(e.clientX, e.clientY);
  if (hit !== null) setActiveNode(activeNode === hit ? null : hit);
});

});


let _audio = null;

function updateInfo() {

// 3D rotation
function rotate3D(x, y, z) {
  // rotate around X
  let y1 = y * Math.cos(rotX) - z * Math.sin(rotX);
  let z1 = y * Math.sin(rotX) + z * Math.cos(rotX);
  // rotate around Y
  let x2 = x * Math.cos(rotY) + z1 * Math.sin(rotY);
  let z2 = -x * Math.sin(rotY) + z1 * Math.cos(rotY);
  return [x2, y1, z2];
}

const SPHERE_R = 260;
const IMG_SIZE = 58;

function project([x, y, z]) {
  const fov = 900;
  const dz = z + 2.5;
  const scale = fov / dz;
  return [x * scale * zoom + W/2, -y * scale * zoom + H/2, z];
}

// Compute projected positions of all nodes
function getProjected() {
  return basePositions.map(([x,y,z], idx) => {
    const id = idx + 1;
    const R = SPHERE_R;
    const [rx, ry, rz] = rotate3D(x*R/zoom, y*R/zoom, z*R/zoom);
    // re-apply zoom in project
    const fov = 900 * zoom;
    const dz = rz/(zoom) + 2.5 * SPHERE_R;
    const sc = fov / dz;
    const px = rx * sc/zoom * zoom + W/2;
    const py = -ry * sc/zoom * zoom + H/2;
    return {id, x: px, y: py, z: rz, raw: [x,y,z]};
  });
}

// Better project: simple orthographic-ish with mild perspective
function getNodes() {
  return basePositions.map(([bx,by,bz], idx) => {
    const id = idx + 1;
    const [rx, ry, rz] = rotate3D(bx, by, bz);
    const fov = 1.8;
    const sc = SPHERE_R * zoom * fov / (fov + rz * 0.6 + 1.0);
    const px = rx * sc + W/2;
    const py = -ry * sc + H/2;
    return {id, x: px, y: py, z: rz};
  });
}

// Hit test
function hitTest(mx, my) {
  const nodes = getNodes();
  // Check back to front (reversed so front nodes win)
  const sorted = [...nodes].sort((a,b) => b.z - a.z);
  for (const n of sorted) {
    const half = IMG_SIZE * zoom * 0.5;
    if (Math.abs(mx - n.x) < half && Math.abs(my - n.y) < half) return n.id;
  }
  return null;
}

// Pulse dots — 3 balls per active edge, fixed offsets, speed 0.0003/frame
const PULSE_OFFSETS = [0, 0.33, 0.66];
const PULSE_RADII = [2, 3, 4];
const pulseProgress = {}; // key -> {from, to, t}

function syncPulses() {
  if (activeNode === null) {
    for (const k in pulseProgress) delete pulseProgress[k];
    return;
  }
  const conn = ADJACENCY[activeNode];
  const activeKeys = new Set();
  for (const nb of conn) {
    const key = activeNode < nb ? `${activeNode}-${nb}` : `${nb}-${activeNode}`;
    activeKeys.add(key);
    if (!(key in pulseProgress)) pulseProgress[key] = {from: activeNode, to: nb, t: 0};
  }
  for (const k in pulseProgress) {
    if (!activeKeys.has(k)) delete pulseProgress[k];
  }
}

// Animation loop
function lerpAngle(cur, tgt, t) {
  let d = ((tgt - cur) % (2 * Math.PI) + 3 * Math.PI) % (2 * Math.PI) - Math.PI;
  return cur + d * t;
}

function colorWithAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function setActiveNode(id) {
  activeNode = id;
  if (id !== null) {
    const [bx, by, bz] = basePositions[id - 1];
    // Bring node to front: targetRotX so y-component vanishes, targetRotY so x-component vanishes
    targetRotX = Math.atan2(by, bz) + Math.PI;
    targetRotY = Math.atan2(bx, Math.sqrt(by * by + bz * bz));
  }
  updateInfo();
  syncPulses();
}

// ── Starfield ────────────────────────────────────────────────────────────────
function rnd(min, max) { return min + Math.random() * (max - min); }
function genStars() {
  const small = [], medium = [], bright = [];
  for (let i = 0; i < 300; i++) small.push({x:Math.random(), y:Math.random(), r:rnd(0.2,0.8), a:rnd(0.15,0.5)});
  for (let i = 0; i < 60;  i++) medium.push({x:Math.random(), y:Math.random(), r:rnd(0.8,1.4), a:rnd(0.4,0.8)});
  for (let i = 0; i < 15;  i++) bright.push({x:Math.random(), y:Math.random(), r:rnd(1.4,2.2), baseA:rnd(0.7,1.0), phase:rnd(0, Math.PI*2)});
  return {small, medium, bright};
}
const STARS = genStars();

// ── Nebula offscreen canvas ─────────────────────────────────────────────────
function buildNebula(w, h) {
  nebulaCanvas = document.createElement('canvas');
  nebulaCanvas.width = w; nebulaCanvas.height = h;
  const nc = nebulaCanvas.getContext('2d');
  const blobs = [
    {cx:0.25, cy:0.30, r:0.35, col:'#1a0535', op:0.35},
    {cx:0.75, cy:0.65, r:0.30, col:'#050a30', op:0.30},
    {cx:0.50, cy:0.50, r:0.25, col:'#0d1525', op:0.20},
  ];
  nc.filter = 'blur(80px)';
  for (const b of blobs) {
    const gr = nc.createRadialGradient(b.cx*w, b.cy*h, 0, b.cx*w, b.cy*h, b.r*w);
    const rv = parseInt(b.col.slice(1,3),16), gv = parseInt(b.col.slice(3,5),16), bv = parseInt(b.col.slice(5,7),16);
    gr.addColorStop(0, `rgba(${rv},${gv},${bv},${b.op})`);
    gr.addColorStop(1, `rgba(${rv},${gv},${bv},0)`);
    nc.fillStyle = gr;
    nc.fillRect(0, 0, w, h);
  }
  nc.filter = 'none';
}
let lastTime = 0;
let animId;

function draw(ts) {
  animId = requestAnimationFrame(draw);
  const dt = ts - lastTime; lastTime = ts;

  // Camera: lerp toward active node or autorotate
  if (activeNode !== null) {
    rotX = lerpAngle(rotX, targetRotX, 0.04);
    rotY = lerpAngle(rotY, targetRotY, 0.04);
  } else if (!dragging) {
    rotY += AUTO_SPEED;
  }

  // ── Spotlight + size animation ──
  if (activeNode !== null) {
    const conn = ADJACENCY[activeNode];
    for (let i = 1; i <= N; i++) {
      const isCluster = i === activeNode || conn.includes(i);
      nodeOpacity[i]    += ((isCluster ? 1.0 : 0.06) - nodeOpacity[i])    * 0.05;
      activeSizeScale[i]+= ((i === activeNode ? 1.2 : 1.0) - activeSizeScale[i]) * 0.08;
    }
    connOpacity  += (0.0  - connOpacity)  * 0.05;
    overlayAlpha += (0.45 - overlayAlpha) * 0.05;
  } else {
    for (let i = 1; i <= N; i++) {
      nodeOpacity[i]    += (1.0 - nodeOpacity[i])    * 0.05;
      activeSizeScale[i]+= (1.0 - activeSizeScale[i]) * 0.08;
    }
    connOpacity  += (1.0 - connOpacity)  * 0.05;
    overlayAlpha += (0.0 - overlayAlpha) * 0.05;
  }

  // ── Background: solid fill → nebula → stars ──
  ctx.fillStyle = '#231e22';
  ctx.fillRect(0, 0, W, H);
  if (nebulaCanvas) ctx.drawImage(nebulaCanvas, 0, 0);

  // Small + medium stars (static)
  for (const s of STARS.small) {
    ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(220,210,255,${s.a})`; ctx.fill();
  }
  for (const s of STARS.medium) {
    ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(220,210,255,${s.a})`; ctx.fill();
  }
  // Bright stars (twinkle)
  for (const s of STARS.bright) {
    const a = Math.min(1, Math.max(0, s.baseA + 0.3 * Math.sin(ts * 0.0008 + s.phase)));
    ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(220,210,255,${a.toFixed(3)})`; ctx.fill();
  }

  // Dark overlay for spotlight
  if (overlayAlpha > 0.001) {
    ctx.fillStyle = `rgba(35,30,34,${overlayAlpha.toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
  }

  const nodes = getNodes();
  const nodeMap = {};
  for (const n of nodes) nodeMap[n.id] = n;

  // Draw passive connections (back to front to avoid overdraw issues — just draw all)
  // Collect unique edges
  const drawnEdges = new Set();
  for (let id = 1; id <= N; id++) {
    for (const nb of ADJACENCY[id]) {
      const key = id < nb ? `${id}-${nb}` : `${nb}-${id}`;
      if (drawnEdges.has(key)) continue;
      drawnEdges.add(key);

      const a = nodeMap[id], b = nodeMap[nb];
      const isActive = (activeNode === id || activeNode === nb) &&
                       ADJACENCY[id].includes(nb);

      if (isActive) {
        const col = nodeColor(activeNode);
        ctx.save();
        ctx.strokeStyle = col;
        ctx.lineWidth = 2.0;
        ctx.globalAlpha = 0.75;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.restore();
      } else if (connOpacity > 0.001) {
        ctx.save();
        ctx.strokeStyle = `rgba(255,255,255,${(0.18 * connOpacity).toFixed(3)})`;
        ctx.lineWidth = 1.0;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  // Update and draw pulses (3 balls per edge, no glow)
  syncPulses();
  if (activeNode !== null) {
    const col = nodeColor(activeNode);
    for (const key in pulseProgress) {
      const p = pulseProgress[key];
      p.t += 0.0007;
      if (p.t >= 1) p.t = 0;
      const a = nodeMap[p.from], b = nodeMap[p.to];
      if (!a || !b) continue;
      for (let i = 0; i < PULSE_OFFSETS.length; i++) {
        const t = (p.t + PULSE_OFFSETS[i]) % 1;
        const px = a.x + (b.x - a.x) * t;
        const py = a.y + (b.y - a.y) * t;
        ctx.save();
        ctx.fillStyle = col;
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.arc(px, py, PULSE_RADII[i] * zoom, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  // Draw nodes (sorted back to front)
  const sorted = [...nodes].sort((a,b) => a.z - b.z);
  for (const n of sorted) {
    const img = imgs[n.id];
    const isz = IMG_SIZE * zoom * (0.85 + (n.z + 1) * 0.08) * activeSizeScale[n.id];
    const isActive = n.id === activeNode;

    // Correct aspect ratio (contain logic)
    const iw = img.naturalWidth || img.width || 1;
    const ih = img.naturalHeight || img.height || 1;
    const scale = Math.min(isz / iw, isz / ih);
    const dw = iw * scale;
    const dh = ih * scale;
    const dx = n.x - dw / 2;
    const dy = n.y - dh / 2;

    ctx.save();
    ctx.globalAlpha = nodeOpacity[n.id];
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, dx, dy, dw, dh);
    ctx.restore();

    // Node number — own color, fades with nodeOpacity
    ctx.save();
    ctx.font = `900 ${Math.round(10 * zoom)}px eight-condensed, Hack, monospace`;
    ctx.fillStyle = colorWithAlpha(nodeColor(n.id), nodeOpacity[n.id] * 0.85);
    ctx.textAlign = 'center';
    ctx.fillText(n.id, n.x, n.y + dh / 2 + 12 * zoom);
    ctx.restore();
  }
}

function init() {
  buildNebula(W, H);
  requestAnimationFrame(draw);
}
</script>
</body>
